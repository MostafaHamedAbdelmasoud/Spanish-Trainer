<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Spanish Vocabulary Trainer</title>
<style>
:root{--red:#C0392B;--red-d:#7d251b;--bg:#fbf7f4;--card:#fff;--ink:#2c2c2a;--mut:#7a756f;--line:#ece4de;--ok:#1d9e75;--okbg:#e1f5ee;--err:#e24b4a;--errbg:#fceceb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;font-weight:600;margin:4px 0 2px;color:var(--red)}
.sub{font-size:13px;color:var(--mut);margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,button{font-family:inherit;font-size:14px}
select{flex:1;min-width:140px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.seg{display:flex;background:#f0e7e1;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--mut);font-weight:500;cursor:pointer}
.seg button.on{background:#fff;color:var(--red);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bar{height:6px;background:#eee3db;border-radius:6px;overflow:hidden;margin:2px 0 14px}
.bar > i{display:block;height:100%;background:var(--red);width:0;transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 18px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;position:relative}
.tag{position:absolute;top:12px;left:14px;font-size:11px;color:var(--red);background:#f6e9e5;padding:3px 9px;border-radius:20px;font-weight:600}
.big{font-size:30px;font-weight:600;margin:6px 0}
.small{font-size:15px;color:var(--mut)}
.hint{font-size:12px;color:#b7ada6;margin-top:14px}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-weight:500;cursor:pointer}
.nav button.pri{background:var(--red);color:#fff;border-color:var(--red)}
.nav button:active{transform:scale(.98)}
.count{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:16px;color:var(--ink);cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#0f6e56;font-weight:500}
.opt.no{background:var(--errbg);border-color:var(--err);color:#a32d2d}
.q{font-size:26px;font-weight:600;text-align:center;margin:8px 0 4px}
.qsub{font-size:13px;color:var(--mut);text-align:center;margin-bottom:6px}
.score{font-size:13px;color:var(--mut);text-align:center;margin-bottom:8px}
.done{text-align:center;padding:20px}
.done .n{font-size:40px;font-weight:700;color:var(--red)}
/* source strip */
.src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.src .dot{width:7px;height:7px;border-radius:50%;background:var(--mut);flex:none}
.src.live .dot{background:var(--ok)}
.src.file .dot{background:var(--ok)}
.src.offline .dot{background:#e0a03c}
.src .grow{flex:1;min-width:120px}
.src button{border:1px solid var(--line);background:#fbf7f4;border-radius:8px;padding:5px 10px;color:var(--ink);cursor:pointer;font-size:12px}
.src button:hover{background:#f3ece7}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);margin:-4px 0 12px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--red);width:15px;height:15px}
.qpick{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qpick label{font-size:13px;color:var(--mut);white-space:nowrap}
.qpick select{flex:1}
.empty{text-align:center;color:var(--mut);padding:40px 18px;font-size:14px}
</style></head><body><div class="wrap">
<h1>Spanish vocabulary trainer</h1>
<p class="sub" id="total">Loading vocabulary from Excel…</p>

<div class="src offline" id="src">
  <span class="dot"></span>
  <span class="grow" id="srcText">Checking for Spanish_Vocabulary_Study.xlsx…</span>
  <button id="pickBtn" onclick="document.getElementById('file').click()">Choose Excel file</button>
  <input type="file" id="file" accept=".xlsx,.xlsm,.xls" style="display:none">
</div>

<div id="app" style="display:none">
<div class="row">
  <select id="cat"></select>
  <select id="dir">
    <option value="es">Español → English</option>
    <option value="en">English → Español</option>
  </select>
</div>
<label class="chk"><input type="checkbox" id="hideKnown"> Skip words marked ✓ Known in the sheet <span id="knownCount"></span></label>
<div class="seg">
  <button id="mFlash" class="on" onclick="setMode('flash')">Flashcards</button>
  <button id="mQuiz" onclick="setMode('quiz')">Quiz</button>
</div>
<div class="bar"><i id="prog"></i></div>
<div id="view"></div>
</div>
<div class="empty" id="need">Choose your <b>Spanish_Vocabulary_Study.xlsx</b> file above to start.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Vocabulary is ALWAYS read from Spanish_Vocabulary_Study.xlsx — no words are stored in this file. */
const XLSX_NAME = 'Spanish_Vocabulary_Study.xlsx';

let DATA = {}, cats = [];
let mode='flash', catSel='__ALL__', dir='es', hideKnown=false;
let deck=[], idx=0, flipped=false;
let quiz=[], qi=0, qScore=0, answered=false, wrong=[];

/* ---------- reading the workbook ---------- */
// Sheet = category. Row 1 title, row 2 headers, data from row 3.
// Col A = Español, col B = English, col C = ✓ Known (any value counts as known).
function parseWorkbook(buf){
  const wb = XLSX.read(buf, {type:'array'});
  const out = {};
  wb.SheetNames.forEach(name=>{
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, blankrows:false});
    const words = [];
    rows.slice(2).forEach(r=>{
      if(!r) return;
      const es = (r[0]||'').toString().replace(/\s+/g,' ').trim();
      const en = (r[1]||'').toString().replace(/\s+/g,' ').trim();
      if(!es || !en) return;
      if(es.toLowerCase()==='español') return;         // in case of a repeated header
      const known = (r[2]!==undefined && r[2]!==null && r[2].toString().trim()!=='') ? 1 : 0;
      words.push([es,en,known]);
    });
    if(words.length) out[name] = words;
  });
  if(!Object.keys(out).length) throw new Error('No vocabulary rows found');
  return out;
}

function setSource(state, text, showBtn){
  const el = document.getElementById('src');
  el.className = 'src ' + state;
  document.getElementById('srcText').textContent = text;
  document.getElementById('pickBtn').style.display = showBtn ? '' : 'none';
}

async function boot(){
  // 1. Try to read the workbook sitting next to this file.
  try{
    const res = await fetch(encodeURIComponent(XLSX_NAME), {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    DATA = parseWorkbook(await res.arrayBuffer());
    setSource('live', 'Live from ' + XLSX_NAME, true);
    init();
    return;
  }catch(e){ /* falls through — usually the file:// restriction */ }

  // 2. Couldn't read it — the Excel file is required, so ask for it.
  setSource('offline', 'Excel file required — choose Spanish_Vocabulary_Study.xlsx to start', true);
  document.getElementById('total').textContent = 'No vocabulary loaded yet';
}

document.getElementById('file').onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      DATA = parseWorkbook(new Uint8Array(r.result));
      setSource('file', 'Loaded from ' + f.name, true);
      init();
    }catch(err){
      setSource('offline', "Couldn't read that file — check it has Español in column A and English in column B", true);
    }
  };
  r.onerror = () => setSource('offline', "Couldn't open that file — try again", true);
  r.readAsArrayBuffer(f);
};

/* ---------- setting up the controls ---------- */
function init(){
  document.getElementById('app').style.display='';
  document.getElementById('need').style.display='none';
  cats = Object.keys(DATA);
  const tot = cats.reduce((s,c)=>s+DATA[c].length,0);
  const known = cats.reduce((s,c)=>s+DATA[c].filter(w=>w[2]).length,0);

  const catEl = document.getElementById('cat');
  const prev = catSel;
  catEl.innerHTML = '';
  let opt = document.createElement('option');
  opt.value='__ALL__'; opt.textContent='All categories ('+tot+')';
  catEl.appendChild(opt);
  cats.forEach(c=>{
    const o=document.createElement('option');
    o.value=c; o.textContent=c+' ('+DATA[c].length+')';
    catEl.appendChild(o);
  });
  catSel = cats.includes(prev) ? prev : '__ALL__';
  catEl.value = catSel;

  document.getElementById('total').textContent = tot+' words across '+cats.length+' categories';
  document.getElementById('knownCount').textContent = known ? '('+known+' marked)' : '(none marked yet)';
  rebuild();
}

document.getElementById('cat').onchange = e=>{catSel=e.target.value;rebuild();};
document.getElementById('dir').onchange = e=>{dir=e.target.value;rebuild();};
document.getElementById('hideKnown').onchange = e=>{hideKnown=e.target.checked;rebuild();};

/* ---------- study logic ---------- */
function pool(){
  let a=[];
  (catSel==='__ALL__'?cats:[catSel]).forEach(c=>DATA[c].forEach(p=>{
    if(hideKnown && p[2]) return;
    a.push({es:p[0],en:p[1],cat:c});
  }));
  return a;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function setMode(m){mode=m;document.getElementById('mFlash').classList.toggle('on',m==='flash');document.getElementById('mQuiz').classList.toggle('on',m==='quiz');rebuild();}
function rebuild(){
  if(!pool().length){
    setProg(0);
    document.getElementById('view').innerHTML='<div class="empty">No words to study here. Try another category, or untick the ✓ Known filter.</div>';
    return;
  }
  if(mode==='flash'){deck=shuffle(pool());idx=0;flipped=false;renderFlash();}
  else{startQuiz();}
}
function setProg(p){document.getElementById('prog').style.width=(p*100)+'%';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderFlash(){
  setProg(deck.length?idx/deck.length:0);
  const c=deck[idx];const front=dir==='es'?c.es:c.en;const back=dir==='es'?c.en:c.es;
  document.getElementById('view').innerHTML=
   '<div class="card" onclick="flip()"><span class="tag">'+esc(c.cat.split(' ')[0])+'</span>'+
     '<div class="'+(flipped?'small':'big')+'">'+esc(front)+'</div>'+
     (flipped?'<div class="big">'+esc(back)+'</div>':'<div class="hint">tap to reveal</div>')+
   '</div>'+
   '<div class="nav"><button onclick="prev()">‹ Back</button>'+
     '<button class="pri" onclick="flip()">'+(flipped?'Hide':'Reveal')+'</button>'+
     '<button onclick="next()">Next ›</button></div>'+
   '<div class="count">Card '+(idx+1)+' of '+deck.length+'</div>';
}
function flip(){flipped=!flipped;renderFlash();}
function next(){idx=(idx+1)%deck.length;flipped=false;renderFlash();}
function prev(){idx=(idx-1+deck.length)%deck.length;flipped=false;renderFlash();}

function startQuiz(list){quiz=shuffle(list?list.slice():pool());qi=0;qScore=0;wrong=[];answered=false;renderQuiz();}
function pagePicker(){
  let h='<div class="qpick"><label>Page</label><select onchange="pickPage(this.value)">';
  h+='<option value="__ALL__"'+(catSel==='__ALL__'?' selected':'')+'>All pages</option>';
  cats.forEach(c=>{h+='<option value="'+esc(c)+'"'+(c===catSel?' selected':'')+'>'+esc(c)+' ('+DATA[c].length+')</option>';});
  return h+'</select></div>';
}
function pickPage(v){catSel=v;document.getElementById('cat').value=v;rebuild();}
function renderQuiz(){
  if(qi>=quiz.length){
    setProg(1);
    let mis='';
    if(wrong.length){mis='<div style="text-align:left;margin-top:6px;font-size:14px">'+wrong.map(w=>'<div style="padding:6px 0;border-top:1px solid var(--line)"><b>'+esc(w.es)+'</b> — '+esc(w.en)+'</div>').join('')+'</div>';}
    document.getElementById('view').innerHTML=pagePicker()+'<div class="card" style="cursor:default"><div class="done"><div class="n">'+qScore+'/'+quiz.length+'</div><div class="small" style="margin:8px 0 6px">'+(qScore>=quiz.length*0.8?'¡Excelente!':qScore>=quiz.length*0.5?'Good progress — keep going.':'Keep practising, you\'ll get there.')+'</div>'+(wrong.length?'<div class="small">Words you missed ('+wrong.length+'):</div>'+mis:'')+'</div></div><div class="nav">'+(wrong.length?'<button onclick="startQuiz(wrong)">Retry missed ('+wrong.length+')</button>':'')+'<button class="pri" onclick="startQuiz()">Restart page ↻</button></div>';
    return;}
  setProg(qi/quiz.length);
  const c=quiz[qi];const q=dir==='es'?c.es:c.en;const ans=dir==='es'?c.en:c.es;
  const others=[...new Set(shuffle(pool()).map(x=>dir==='es'?x.en:x.es).filter(v=>v.toLowerCase()!==ans.toLowerCase()))].slice(0,3);
  const opts=shuffle([ans,...others]);
  let h=pagePicker()+'<div class="score">Score '+qScore+' · Question '+(qi+1)+' of '+quiz.length+'</div>'+
   '<div class="qsub">'+(dir==='es'?'What does this mean?':'How do you say this?')+'</div>'+
   '<div class="q">'+esc(q)+'</div><div id="opts">';
  opts.forEach(o=>{h+='<button class="opt" data-v="'+esc(o)+'" onclick="answer(this)">'+esc(o)+'</button>';});
  h+='</div>';
  document.getElementById('view').innerHTML=h;
  document.getElementById('opts').dataset.ans=ans;
  answered=false;
}
function answer(btn){
  if(answered)return;answered=true;
  const correct=document.getElementById('opts').dataset.ans;
  document.querySelectorAll('#opts .opt').forEach(b=>{if(b.dataset.v===correct)b.classList.add('ok');});
  if(btn.dataset.v===correct){qScore++;}else{btn.classList.add('no');wrong.push(quiz[qi]);}
  setTimeout(()=>{qi++;renderQuiz();},900);
}

boot();
</script></body></html>
